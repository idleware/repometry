name: Repometry
description: Inspect a checked-out Git revision and save its quality report.
inputs:
  repo:
    description: Path to the checked-out repository.
    default: '.'
  revision:
    description: Git revision present in the checkout.
    default: HEAD
  store:
    description: Directory for private report files. Defaults to .repometry inside repo.
    default: ''
  lcov:
    description: Optional LCOV files for the inspected revision, one per line.
    default: ''
  config:
    description: Optional Repometry JSON configuration file.
    default: ''
  import:
    description: Other reports to import, one FORMAT=FILE per line.
    default: ''
  sources:
    description: Source provider for detailed reports.
    default: auto
  fail-on-partial:
    description: Fail the step when Repometry saves a partial report.
    default: 'true'
  diff-base:
    description: Optional base revision for changed-line coverage.
    default: ''
  min-diff-coverage:
    description: Optional minimum changed-line coverage percentage.
    default: ''
  min-diff-lines:
    description: Optional minimum number of measured changed lines before applying the diff coverage gate.
    default: ''
  max-coverage-drop:
    description: Maximum total coverage drop in percentage points against the saved baseline.
    default: ''
  max-new-issues:
    description: Maximum number of new non-sensitive inspection findings against the saved baseline.
    default: ''
  baseline-store:
    description: Optional directory containing the baseline report for diff review.
    default: ''
  pr-number:
    description: Optional PR number under which to save the latest review in the private report store.
    default: ''
  annotations:
    description: Add GitHub annotations for up to ten measured, uncovered lines from the diff.
    default: 'false'
  comment-pr:
    description: Update a coverage-only comment on same-repository pull requests. Requires pull-requests write permission.
    default: 'false'
  public-site:
    description: Optional destination for the publishable HTML and aggregate JSON export.
    default: ''
outputs:
  subject:
    description: Full SHA of the inspected commit.
    value: ${{ steps.inspect.outputs.subject }}
  status:
    description: Report status (complete, partial or not-applicable).
    value: ${{ steps.inspect.outputs.status }}
  diff-coverage-status:
    description: Changed-line coverage status when requested.
    value: ${{ steps.diff-coverage.outputs.status }}
  diff-coverage-percent:
    description: Observed changed-line coverage percentage when available.
    value: ${{ steps.diff-coverage.outputs.percent }}
  diff-coverage-decision:
    description: Coverage threshold decision when requested.
    value: ${{ steps.diff-coverage.outputs.decision }}
  coverage-percent:
    description: Total line coverage of the inspected head commit.
    value: ${{ steps.diff-coverage.outputs.coverage-percent }}
  coverage-delta:
    description: Total line coverage change in percentage points compared to the configured base revision.
    value: ${{ steps.diff-coverage.outputs.coverage-delta }}
  coverage-decision:
    description: Total coverage gate decision when requested.
    value: ${{ steps.diff-coverage.outputs.coverage-decision }}
  new-issues:
    description: Number of non-sensitive findings introduced relative to the configured base revision when both are comparable.
    value: ${{ steps.diff-coverage.outputs.new-issues }}
  issues-decision:
    description: New issues gate decision when requested.
    value: ${{ steps.diff-coverage.outputs.issues-decision }}
runs:
  using: composite
  steps:
    - name: Build Repometry
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        node -e 'if (Number(process.versions.node.split(".")[0]) < 24) throw new Error("Repometry requires Node.js 24 or newer")'
        npm ci --ignore-scripts --no-audit --no-fund
        npm run build
    - name: Inspect repository
      id: inspect
      shell: bash
      env:
        REPOMETRY_REPO: ${{ inputs.repo }}
        REPOMETRY_REVISION: ${{ inputs.revision }}
        REPOMETRY_STORE: ${{ inputs.store }}
        REPOMETRY_LCOV: ${{ inputs.lcov }}
        REPOMETRY_CONFIG: ${{ inputs.config }}
        REPOMETRY_FAIL_ON_PARTIAL: ${{ inputs.fail-on-partial }}
        REPOMETRY_COMMENT_PR: ${{ inputs.comment-pr }}
        REPOMETRY_IMPORT: ${{ inputs.import }}
      run: |
        case "$REPOMETRY_FAIL_ON_PARTIAL" in
          true|false) ;;
          *) echo 'fail-on-partial must be true or false' >&2; exit 1 ;;
        esac
        case "$REPOMETRY_COMMENT_PR" in
          true|false) ;;
          *) echo 'comment-pr must be true or false' >&2; exit 1 ;;
        esac
        args=(analyze "--repo=$REPOMETRY_REPO" --ci github)
        if [[ -n "$REPOMETRY_STORE" ]]; then args+=("--store=$REPOMETRY_STORE"); fi
        while IFS= read -r lcov; do
          if [[ -n "$lcov" ]]; then args+=("--import=lcov=$lcov"); fi
        done <<< "$REPOMETRY_LCOV"
        if [[ -n "$REPOMETRY_CONFIG" ]]; then args+=("--config=$REPOMETRY_CONFIG"); fi
        while IFS= read -r report; do
          if [[ -n "$report" ]]; then args+=("--import=$report"); fi
        done <<< "$REPOMETRY_IMPORT"
        args+=(-- "$REPOMETRY_REVISION")
        code=0
        node "$GITHUB_ACTION_PATH/target/main/ts/cli/main.js" "${args[@]}" || code=$?
        if [[ "$code" == 2 && "$REPOMETRY_FAIL_ON_PARTIAL" == false ]]; then exit 0; fi
        exit "$code"
    - name: Review changes
      id: diff-coverage
      if: ${{ !cancelled() && steps.inspect.outputs.subject != '' && (inputs.diff-base != '' || inputs.min-diff-coverage != '' || inputs.min-diff-lines != '' || inputs.max-coverage-drop != '' || inputs.max-new-issues != '' || inputs.pr-number != '' || inputs.annotations != 'false') }}
      shell: bash
      env:
        REPOMETRY_REPO: ${{ inputs.repo }}
        REPOMETRY_HEAD: ${{ steps.inspect.outputs.subject }}
        REPOMETRY_BASE: ${{ inputs.diff-base }}
        REPOMETRY_LCOV: ${{ inputs.lcov }}
        REPOMETRY_STORE: ${{ inputs.store }}
        REPOMETRY_CONFIG: ${{ inputs.config }}
        REPOMETRY_MIN_DIFF_COVERAGE: ${{ inputs.min-diff-coverage }}
        REPOMETRY_MIN_DIFF_LINES: ${{ inputs.min-diff-lines }}
        REPOMETRY_MAX_COVERAGE_DROP: ${{ inputs.max-coverage-drop }}
        REPOMETRY_MAX_NEW_ISSUES: ${{ inputs.max-new-issues }}
        REPOMETRY_BASELINE_STORE: ${{ inputs.baseline-store }}
        REPOMETRY_PR_NUMBER: ${{ inputs.pr-number }}
        REPOMETRY_ANNOTATIONS: ${{ inputs.annotations }}
      run: |
        args=(review "--repo=$REPOMETRY_REPO" --ci github)
        while IFS= read -r lcov; do
          if [[ -n "$lcov" ]]; then args+=("--import=lcov=$lcov"); fi
        done <<< "$REPOMETRY_LCOV"
        if [[ -n "$REPOMETRY_STORE" ]]; then args+=("--store=$REPOMETRY_STORE"); fi
        if [[ -n "$REPOMETRY_CONFIG" ]]; then args+=("--config=$REPOMETRY_CONFIG"); fi
        if [[ -n "$REPOMETRY_MIN_DIFF_COVERAGE" ]]; then args+=("--min-coverage=$REPOMETRY_MIN_DIFF_COVERAGE"); fi
        if [[ -n "$REPOMETRY_MIN_DIFF_LINES" ]]; then args+=("--min-lines=$REPOMETRY_MIN_DIFF_LINES"); fi
        if [[ -n "$REPOMETRY_MAX_COVERAGE_DROP" ]]; then args+=("--max-coverage-drop=$REPOMETRY_MAX_COVERAGE_DROP"); fi
        if [[ -n "$REPOMETRY_MAX_NEW_ISSUES" ]]; then args+=("--max-new-issues=$REPOMETRY_MAX_NEW_ISSUES"); fi
        if [[ -n "$REPOMETRY_BASELINE_STORE" ]]; then args+=("--baseline-store=$REPOMETRY_BASELINE_STORE"); fi
        if [[ -n "$REPOMETRY_PR_NUMBER" ]]; then args+=("--pull=$REPOMETRY_PR_NUMBER"); fi
        case "$REPOMETRY_ANNOTATIONS" in
          true) args+=(--annotations) ;;
          false) ;;
          *) echo 'annotations must be true or false' >&2; exit 1 ;;
        esac
        args+=(-- "$REPOMETRY_BASE" "$REPOMETRY_HEAD")
        node "$GITHUB_ACTION_PATH/target/main/ts/cli/main.js" "${args[@]}" >/dev/null
    - name: Post PR coverage summary
      if: >-
        ${{ !cancelled() && inputs.comment-pr == 'true' && github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository && steps.diff-coverage.outputs.review-head != '' }}
      shell: bash
      env:
        REPOMETRY_COMMENT_TOKEN: ${{ github.token }}
        REPOMETRY_PR_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        REPOMETRY_PR_NUMBER: ${{ github.event.pull_request.number }}
        REPOMETRY_PR_BASE: ${{ github.event.pull_request.base.sha }}
        REPOMETRY_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        REPOMETRY_REVIEW_BASE: ${{ steps.diff-coverage.outputs.review-base }}
        REPOMETRY_REVIEW_HEAD: ${{ steps.diff-coverage.outputs.review-head }}
        REPOMETRY_TOTAL_PERCENT: ${{ steps.diff-coverage.outputs.coverage-percent }}
        REPOMETRY_TOTAL_DELTA: ${{ steps.diff-coverage.outputs.coverage-delta }}
        REPOMETRY_TOTAL_GATE: ${{ steps.diff-coverage.outputs.coverage-decision }}
        REPOMETRY_DIFF_PERCENT: ${{ steps.diff-coverage.outputs.percent }}
        REPOMETRY_DIFF_STATUS: ${{ steps.diff-coverage.outputs.status }}
        REPOMETRY_DIFF_GATE: ${{ steps.diff-coverage.outputs.decision }}
        REPOMETRY_DIFF_COVERED: ${{ steps.diff-coverage.outputs.diff-covered }}
        REPOMETRY_DIFF_TOTAL: ${{ steps.diff-coverage.outputs.diff-total }}
      run: node "$GITHUB_ACTION_PATH/target/main/ts/cli/github-pr-comment.js"
    - name: Export public report
      if: ${{ !cancelled() && steps.inspect.outputs.subject != '' && inputs.public-site != '' }}
      shell: bash
      env:
        REPOMETRY_REPO: ${{ inputs.repo }}
        REPOMETRY_STORE: ${{ inputs.store }}
        REPOMETRY_CONFIG: ${{ inputs.config }}
        REPOMETRY_SOURCES: ${{ inputs.sources }}
        REPOMETRY_PUBLIC_SITE: ${{ inputs.public-site }}
      run: |
        args=(report "--repo=$REPOMETRY_REPO" --mode public "--sources=$REPOMETRY_SOURCES")
        if [[ -n "$REPOMETRY_STORE" ]]; then args+=("--store=$REPOMETRY_STORE"); fi
        if [[ -n "$REPOMETRY_CONFIG" ]]; then args+=("--config=$REPOMETRY_CONFIG"); fi
        args+=(-- "html=$REPOMETRY_PUBLIC_SITE")
        node "$GITHUB_ACTION_PATH/target/main/ts/cli/main.js" "${args[@]}"
