    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-1 -1 32 32'%3E%3Cstyle%3E.f%7Bfill:%231f6b35%7D.s%7Bfill:%235fae6a%7D@media (prefers-color-scheme:dark)%7B.f%7Bfill:%238fe08f%7D.s%7Bfill:%233f8a4c%7D%7D%3C/style%3E%3Cpath class='f' d='M3 4 29 3 3 15z'/%3E%3Cpath class='s' d='M3 19 9 16.23V29H3zM13 14.38l6-2.77V29h-6zM23 9.77 29 7v22h-6z'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./projects.js"></script>
  </head>
  <body class="project-index">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="topbar-row">
          <a class="brand" href="./" title="Repometry"><svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><path class="brand-flag" d="M3 4 29 3 3 15z"/><path d="M3 19 9 16.23V29H3zM13 14.38l6-2.77V29h-6zM23 9.77 29 7v22h-6z"/></svg><span class="visually-hidden">Repometry</span></a>
          <h1>Projects</h1>
        </div>
      </div>
    </header>
    <main>
      <section class="panel" aria-label="Project reports">
        <div class="section-heading">
          <label class="project-filter"><span class="visually-hidden">Filter projects</span><input id="search" type="search" placeholder="Filter projects" autocomplete="off" spellcheck="false"></label>
          <label class="project-sort">Sort by <select id="sort">
            <option value="debt" selected>Highest technical debt</option>
            <option value="coverage">Lowest coverage</option>
            <option value="date">Most recent commit</option>
            <option value="name">Project name</option>
            <option value="size">Largest project</option>
          </select></label>
        </div>
        <p class="detail" id="project-count" role="status">Loading projects…</p>
        <div class="table-scroll" tabindex="0" role="region" aria-label="Project metrics">
          <table aria-label="Project metrics">
            <thead><tr><th scope="col">Repository</th>
              <th scope="col" class="numeric">Technical debt</th><th scope="col" class="numeric">Coverage</th>
              <th scope="col" class="numeric">Duplication</th><th scope="col" class="numeric">Lines of code</th>
              <th scope="col">Latest commit</th></tr></thead>
            <tbody id="projects"></tbody>
          </table>
        </div>
      </section>
    </main>
    <footer class="site-footer">
