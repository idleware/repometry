# npm trusted publishing pins this filename to ci.yaml and the release job to the `gh-cicd` environment.
name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  npm_config_audit: false
  npm_config_fund: false

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # Replace superseded checks while allowing release pushes to finish.
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/master' }}

jobs:
  build:
    name: Build & test (Node 26)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read # Checkout the source used for build and tests.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'npm'

      - run: npm ci --ignore-scripts

      # One instrumented run is the test gate and the coverage: build, typecheck, the full suite under c8.
      - name: Tests + coverage
        timeout-minutes: 15
        run: npm run coverage

      # The coverage build carries source maps; the published build must not, so build once more, clean.
      - name: Clean build
        run: npm run build

      # This phase runs untrusted deps and code (npm ci, the full suite), so it holds NO secrets. It only produces the
      # build and the coverage report; publishing happens downstream in the `gh-cicd` environment.
      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: |
            target/main
            package.json
          retention-days: 1
          if-no-files-found: error

      - name: Cache coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: target/coverage/lcov.info
          retention-days: 7

  smoke:
    name: Smoke (Node ${{ matrix.node }})
    needs: build
    # The BUILT package with no dev dependencies on the lowest Node it supports (24) and the newest (26).
    runs-on: ubuntu-26.04
    timeout-minutes: 8
    permissions:
      contents: read # Checkout package.json and the lockfile for the production install.
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - uses: actions/download-artifact@v8
        with:
          name: build

      - run: npm ci --omit=dev --ignore-scripts

      - name: Smoke the CLI on Node ${{ matrix.node }}
        run: |
          cli="$PWD/target/main/ts/cli/main.js"
          node "$cli" --version
          node "$cli" help analyze
          node "$cli" plugins > /dev/null
          project="$RUNNER_TEMP/smoke"
          mkdir -p "$project/src"
          printf 'export function pick(flag, a, b) { return flag ? a : b; }\n' > "$project/src/index.js"
          cd "$project"
          node "$cli" analyze --working-tree --report html > analysis.json
          test "$(node -p "require('./analysis.json').status")" = complete
          test -f .repometry/report/html/index.html
          test -f .repometry/report/html/summary.json

  release:
    name: Release ${{ github.ref }}
    needs: smoke
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-26.04
    environment: gh-cicd # npm trusted publishing is bound to this environment
    timeout-minutes: 15
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write # Push the release commit/tag and create a GitHub release.
      packages: write # zx-semrel also publishes @idleware/repometry to GitHub Packages.
      id-token: write # OIDC to the npm registry: passwordless publish and provenance.
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          # no `cache: npm`: release installs nothing (see below)

      - uses: actions/download-artifact@v8
        with:
          name: build

      # Artifacts drop file modes; the bin must stay executable in the tarball.
      - name: Restore the executable bit
        run: chmod 755 target/main/ts/cli/main.js

      - name: Release via zx-semrel (OIDC scheme)
        env:
          NPM_OIDC: true
          npm_config_ignore_scripts: true
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: 'x-access-token'
          GIT_BRANCH: 'master'
          GIT_AUTHOR_NAME: ${{ vars.GIT_AUTHOR_NAME }}
          GIT_AUTHOR_EMAIL: ${{ vars.GIT_AUTHOR_EMAIL }}
          GIT_COMMITTER_NAME: ${{ vars.GIT_COMMITTER_NAME }}
          GIT_COMMITTER_EMAIL: ${{ vars.GIT_COMMITTER_EMAIL }}
          GIT_SIGN_KEY: ${{ secrets.GIT_SIGN_KEY }}
        run: npm run release
