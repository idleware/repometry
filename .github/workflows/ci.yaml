# npm trusted publishing is bound to this file name (ci.yaml) and the gh-cicd environment.
name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  npm_config_audit: false
  npm_config_fund: false

permissions: {}

# A newer run of a pull request replaces the older one. Master runs each get a group of their own, so none is
# cancelled: their inspections wait in the Repometry workflow's queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  # Runs untrusted dependencies and code, so it holds no secrets.
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request is built at its own head commit, so the coverage describes the lines its review compares.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0 # the tests run on a full clone
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run coverage
      # The built CLI for the release and Repometry jobs, and the coverage for Repometry.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: |
            target/main
            target/coverage/lcov.info
            package.json
            package-lock.json
          retention-days: 1

  # Installs nothing: publishes the built artifact with pinned zx-semrel only.
  release:
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-26.04
    environment: gh-cicd
    timeout-minutes: 15
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write # release commit, tag and GitHub release
      packages: write # GitHub Packages copy
      id-token: write # npm OIDC and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
      - run: chmod 755 target/main/ts/cli/main.js # artifacts drop file modes
      - run: npm run release
        env:
          NPM_OIDC: true
          npm_config_ignore_scripts: true
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: x-access-token
          GIT_BRANCH: master
          GIT_AUTHOR_NAME: ${{ vars.GIT_AUTHOR_NAME }}
          GIT_AUTHOR_EMAIL: ${{ vars.GIT_AUTHOR_EMAIL }}
          GIT_COMMITTER_NAME: ${{ vars.GIT_COMMITTER_NAME }}
          GIT_COMMITTER_EMAIL: ${{ vars.GIT_COMMITTER_EMAIL }}
          GIT_SIGN_KEY: ${{ secrets.GIT_SIGN_KEY }}

  # Repometry on itself, with this build: the review of a pull request, and on master the history and the report.
  repometry:
    needs: build
    permissions:
      contents: write # the repometry branch, on master
      pages: write # the report on GitHub Pages, on master
      id-token: write # the same
      pull-requests: write # the review comment
    uses: $/.github/workflows/repometry.yaml
