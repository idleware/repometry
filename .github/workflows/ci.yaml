# npm trusted publishing is bound to this file name (ci.yaml) and the gh-cicd environment.
name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  npm_config_audit: false
  npm_config_fund: false

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/master' }}

jobs:
  # Runs untrusted dependencies and code, so it holds no secrets.
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # churn for the self-inspection
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: |
            target/main
            package.json
            package-lock.json
          retention-days: 1
      - if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: node target/main/ts/cli/main.js analyze --store "$RUNNER_TEMP/store" --import lcov=target/coverage/lcov.info
      - if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repometry
          path: ${{ runner.temp }}/store/commits/${{ github.sha }}
          retention-days: 1

  # Installs nothing: publishes the built artifact with pinned zx-semrel only.
  release:
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-26.04
    environment: gh-cicd
    timeout-minutes: 15
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write # release commit, tag and GitHub release
      packages: write # GitHub Packages copy
      id-token: write # npm OIDC and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
      - run: chmod 755 target/main/ts/cli/main.js # artifacts drop file modes
      - run: npm run release
        env:
          NPM_OIDC: true
          npm_config_ignore_scripts: true
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: x-access-token
          GIT_BRANCH: master
          GIT_AUTHOR_NAME: ${{ vars.GIT_AUTHOR_NAME }}
          GIT_AUTHOR_EMAIL: ${{ vars.GIT_AUTHOR_EMAIL }}
          GIT_COMMITTER_NAME: ${{ vars.GIT_COMMITTER_NAME }}
          GIT_COMMITTER_EMAIL: ${{ vars.GIT_COMMITTER_EMAIL }}
          GIT_SIGN_KEY: ${{ secrets.GIT_SIGN_KEY }}

  # Repometry on itself: the inspection goes to the `repometry` branch, the rebuilt report to `gh-pages`.
  # The token is passed only to the two push steps.
  report:
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    concurrency:
      group: report
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GIT_AUTHOR_NAME: ${{ vars.GIT_AUTHOR_NAME }}
      GIT_AUTHOR_EMAIL: ${{ vars.GIT_AUTHOR_EMAIL }}
      GIT_COMMITTER_NAME: ${{ vars.GIT_COMMITTER_NAME }}
      GIT_COMMITTER_EMAIL: ${{ vars.GIT_COMMITTER_EMAIL }}
    steps:
      # Creates the branch on the first run; later runs find the same manifest and commit nothing.
      - working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '{\n  "schema": "urn:repometry:schema:metabranch:1"\n}\n' > manifest.json
          npx --yes ggcp@1.11.0 manifest.json "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git/repometry" \
            --message="chore(metrics): start the repometry data branch [skip ci]"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: repometry
          fetch-tags: true # release tags for the report; titles and authors come with the inspections
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: repometry
          path: commits/${{ github.sha }}
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add -A
          git diff --cached --quiet && exit 0 # a re-run finds the inspection already pushed
          git commit -qm "chore(metrics): inspect ${GITHUB_SHA::7} [skip ci]"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/repometry
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: ${{ runner.temp }}/repometry
      - run: |
          npm ci --omit=dev --ignore-scripts --prefix "$RUNNER_TEMP/repometry"
          node "$RUNNER_TEMP/repometry/target/main/ts/cli/main.js" report "html=$RUNNER_TEMP/site" --store . --title repometry --sources github
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          npx --yes ggcp@1.11.0 '**/*' "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git/gh-pages"
          --cwd="$RUNNER_TEMP/site" --message="docs: update the repometry report for ${GITHUB_SHA::7}"
